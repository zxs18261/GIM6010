<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SguanFOC 学习闯关 · 先学后闯</title>
<style>
  :root{
    --bg1:#0b1220; --bg2:#121b30;
    --card:#1b2740; --card2:#22304f;
    --line:#33466e;
    --txt:#e7eefb; --sub:#9fb0d0;
    --acc:#3ea6ff; --acc2:#6ee7b7;
    --gold:#ffce54; --red:#ff6b81; --purple:#b79cff;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    color:var(--txt);
    background:radial-gradient(1200px 600px at 20% -10%,#1c2f55 0%,transparent 60%),linear-gradient(160deg,var(--bg1),var(--bg2));
    min-height:100%;padding:18px;
  }
  .wrap{max-width:900px;margin:0 auto;}
  h1{font-size:25px;margin:6px 0 2px;}
  .sub{color:var(--sub);margin:0 0 14px;font-size:14px;}
  .top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:8px;}
  .chip{background:var(--card);border:1px solid var(--line);padding:4px 12px;border-radius:20px;font-size:13px;color:var(--sub);}

  /* 顶部导航 */
  .tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;}
  .tab{padding:8px 18px;border-radius:24px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-size:14px;font-weight:700;color:var(--sub);}
  .tab.on{background:var(--acc);color:#06203a;border-color:var(--acc);}

  /* 地图 */
  .map{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;margin-top:6px;}
  .node{background:linear-gradient(160deg,var(--card),var(--card2));border:1px solid var(--line);border-radius:16px;padding:16px;cursor:pointer;transition:.18s;}
  .node:not(.locked):hover{transform:translateY(-3px);border-color:var(--acc);box-shadow:0 8px 20px rgba(62,166,255,.18);}
  .node.locked{opacity:.5;cursor:not-allowed;}
  .node .tt{font-weight:700;font-size:16px;display:flex;justify-content:space-between;align-items:center;}
  .node .ds{color:var(--sub);font-size:12.5px;margin:6px 0 10px;line-height:1.5;}
  .stars{font-size:15px;letter-spacing:2px;color:var(--gold);}
  .qcount{font-size:11px;color:var(--sub);}
  .lockIco{color:var(--sub);}
  .badge{font-size:10px;background:var(--acc);color:#06203a;padding:2px 7px;border-radius:9px;font-weight:700;}
  .node .acts{display:flex;gap:8px;margin-top:10px;}
  .mini{flex:1;text-align:center;font-size:12.5px;padding:7px 4px;border-radius:9px;cursor:pointer;font-weight:700;border:1px solid var(--line);background:#16233d;color:var(--sub);}
  .mini.learn{color:#fff;}
  .mini.learn:hover{border-color:var(--purple);}
  .mini.play{color:#fff;}
  .mini.play:hover{border-color:var(--acc2);}

  .stage{display:none;}
  .stage.on{display:block;animation:fade .25s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(8px);}to{opacity:1;}}

  /* 讲义 */
  .lesson{background:linear-gradient(160deg,var(--card),var(--card2));border:1px solid var(--line);border-radius:18px;padding:20px 22px;}
  .lesson h2{margin:0 0 4px;font-size:21px;}
  .lesson .lede{color:var(--sub);font-size:13px;margin:0 0 14px;}
  .lblk{margin-bottom:14px;}
  .lh{font-size:16px;font-weight:700;margin:16px 0 6px;color:var(--acc);display:flex;align-items:center;gap:8px;}
  .lp{font-size:14.5px;line-height:1.75;color:var(--txt);margin:6px 0;}
  .lp code{background:#0f1930;border:1px solid var(--line);padding:1px 6px;border-radius:6px;font-size:13px;color:var(--acc2);font-family:"Cascadia Code",Consolas,monospace;}
  .lpre{background:#0c1425;border:1px solid var(--line);border-left:3px solid var(--purple);border-radius:10px;padding:11px 14px;overflow:auto;margin:8px 0;font-family:"Cascadia Code",Consolas,monospace;font-size:12.5px;line-height:1.55;color:#d5e3ff;white-space:pre;}
  .lpre .cm{color:#5f7194;}
  .ltip{background:rgba(255,206,84,.08);border:1px solid rgba(255,206,84,.35);color:#ffd978;border-radius:10px;padding:10px 13px;font-size:13px;line-height:1.6;margin:8px 0;}
  .ltip b{color:var(--gold);}
  .lesson .navbtns{display:flex;gap:10px;margin-top:18px;justify-content:flex-end;flex-wrap:wrap;}
  .lessonbar{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px;}
  .lseg{padding:6px 12px;border-radius:20px;font-size:12px;border:1px solid var(--line);color:var(--sub);cursor:pointer;background:#16233d;}
  .lseg.on{background:var(--purple);color:#160f2e;border-color:var(--purple);font-weight:700;}
  .reset{color:var(--sub);font-size:12px;cursor:pointer;text-decoration:underline;}

  /* 游戏卡片 */
  .qcard{background:linear-gradient(160deg,var(--card),var(--card2));border:1px solid var(--line);border-radius:18px;padding:22px;margin-top:6px;}
  .qh{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:6px;}
  .pill{background:rgba(62,166,255,.15);color:var(--acc);padding:3px 10px;border-radius:20px;font-size:12px;font-weight:700;}
  .prog{height:8px;background:#0f1930;border-radius:6px;overflow:hidden;margin:12px 0;}
  .prog>div{height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));transition:width .3s;border-radius:6px;}
  .qtype{font-size:11px;color:var(--purple);background:rgba(183,156,255,.14);display:inline-block;padding:2px 8px;border-radius:8px;margin-bottom:8px;}
  .qtext{font-size:17px;font-weight:600;line-height:1.5;margin-bottom:14px;}
  .hint{font-size:12.5px;color:var(--sub);margin-bottom:12px;}

  .opts{display:flex;flex-direction:column;gap:9px;}
  .opt{background:#16233d;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;transition:.15s;font-size:14.5px;display:flex;gap:10px;align-items:center;}
  .opt:hover{border-color:var(--acc);}
  .opt .letter{font-weight:800;color:var(--acc);min-width:18px;}
  .opt.correct{background:rgba(110,231,183,.12);border-color:var(--acc2);}
  .opt.wrong{background:rgba(255,107,129,.12);border-color:var(--red);}
  .opt:disabled{cursor:default;}

  .sortArea{display:flex;gap:14px;flex-wrap:wrap;}
  .pool,.slot{flex:1;min-width:260px;}
  .pool h4,.slot h4{margin:0 0 8px;font-size:13px;color:var(--sub);}
  .poolbox{background:#0f1930;border:1.5px dashed var(--line);border-radius:12px;padding:10px;min-height:100px;display:flex;flex-direction:column;gap:7px;}
  .slotbox{background:#0f1930;border:1.5px solid var(--acc);border-radius:12px;padding:10px;min-height:100px;display:flex;flex-direction:column;gap:7px;}
  .sitem{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:9px 11px;font-size:13.5px;cursor:grab;display:flex;justify-content:space-between;gap:8px;align-items:center;}
  .sitem.sel{outline:2px solid var(--purple);border-color:var(--purple);}
  .sitem .snum{color:var(--acc2);font-weight:800;font-size:12px;min-width:16px;}
  .rm{color:var(--red);cursor:pointer;font-weight:800;background:none;border:none;font-size:14px;}
  .sortBtns{display:flex;flex-direction:column;gap:6px;margin-top:8px;}
  .sbtn{background:#16233d;border:1px solid var(--line);border-radius:8px;color:var(--txt);padding:5px 0;cursor:pointer;font-size:13px;}
  .sbtn:hover{border-color:var(--acc);}

  .feedback{margin-top:16px;padding:13px 15px;border-radius:12px;font-size:14px;line-height:1.6;display:none;}
  .feedback.good{display:block;background:rgba(110,231,183,.1);border:1px solid var(--acc2);}
  .feedback.bad{display:block;background:rgba(255,107,129,.1);border:1px solid var(--red);}
  .feedback .ex{color:var(--sub);font-size:12.5px;margin-top:8px;line-height:1.6;}
  .btns{display:flex;gap:10px;margin-top:16px;justify-content:space-between;flex-wrap:wrap;}
  button.btn{background:var(--acc);border:none;color:#06203a;font-weight:800;font-size:15px;padding:12px 22px;border-radius:12px;cursor:pointer;transition:.15s;}
  button.btn:hover{transform:translateY(-1px);filter:brightness(1.08);}
  button.btn.ghost{background:#16233d;color:var(--sub);border:1px solid var(--line);font-weight:600;}
  button.btn.purple{background:var(--purple);color:#160f2e;}
  button.btn:disabled{opacity:.4;cursor:not-allowed;transform:none;}
  .combo{font-size:12px;color:var(--gold);font-weight:700;}
  .scoreBig{font-size:24px;font-weight:800;color:var(--gold);}
  .result{text-align:center;padding:10px 0;}
  .result h2{font-size:26px;margin:6px 0;}
  .rStars{font-size:40px;letter-spacing:6px;color:var(--gold);margin:8px 0;}
  .rStats{color:var(--sub);margin:12px 0;}
  .footer{margin-top:22px;text-align:center;color:#5f7194;font-size:12px;}

  /* 薄弱点记录框 */
  .noteBox{margin-top:20px;border:1px dashed var(--line);border-radius:14px;padding:14px 15px;background:rgba(183,156,255,.04);}
  .noteBox:focus-within{border-color:var(--purple);}
  .noteHead{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px;font-weight:800;font-size:14px;color:var(--purple);}
  .noteTip{font-weight:400;font-size:11.5px;color:var(--sub);}
  .noteTa{width:100%;margin-top:10px;background:#0f1930;border:1px solid var(--line);border-radius:10px;color:var(--txt);padding:10px 12px;font-size:13.5px;line-height:1.6;font-family:inherit;resize:vertical;min-height:52px;}
  .noteTa:focus{outline:none;border-color:var(--purple);}
  .noteBtns{display:flex;gap:8px;margin-top:9px;flex-wrap:wrap;align-items:center;}
  .noteBtns .sbtn{width:auto;padding:7px 14px;border-radius:9px;}
  .noteState{font-size:12px;color:var(--acc2);font-weight:700;}
  .noteOut{margin-top:12px;display:flex;flex-direction:column;gap:10px;}
  .cbox{background:#0f1930;border:1px solid var(--line);border-left:3px solid var(--purple);border-radius:10px;padding:11px 14px;}
  .cbox .cbTitle{font-weight:800;color:var(--purple);font-size:13.5px;margin-bottom:5px;}
  .cbox .cbBody{font-size:13px;line-height:1.7;color:#cdd9f2;}
  .cbox .cbBody b{color:var(--acc2);}
  .cbox .cbMem{font-size:12px;color:var(--gold);margin-top:5px;line-height:1.6;}
  .excerpt{font-size:12px;color:var(--sub);background:#16233d;border:1px solid var(--line);border-radius:8px;padding:7px 10px;line-height:1.55;}
  .noteEmpty{font-size:12.5px;color:var(--sub);background:#16233d;border:1px dashed var(--line);border-radius:10px;padding:10px 13px;line-height:1.7;}
  .noteEmpty code{color:var(--acc2);background:#0f1930;padding:0 5px;border-radius:5px;font-size:12px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div>
      <h1>⚙ SguanFOC 先学后闯</h1>
      <p class="sub">看讲义 → 用闯关检验 · 每章解锁 · 本地存档</p>
    </div>
    <div class="chip" id="totalChip">⭐ 0 分 · 0/24 星</div>
  </div>

  <div class="tabs">
    <div class="tab on" id="tabMap" onclick="showPanel('homeStage')">🗺 关卡地图</div>
    <div class="tab" id="tabLrn" onclick="showPanel('learnIndexStage')">📖 全部讲义</div>
  </div>

  <!-- 地图 -->
  <section id="homeStage" class="stage on">
    <div class="map" id="mapBox"></div>
    <div style="margin-top:18px;text-align:center"><span class="reset" onclick="resetAll()">重置全部进度</span></div>
  </section>

  <!-- 讲义列表 -->
  <section id="learnIndexStage" class="stage">
    <div class="map" id="learnIndexBox"></div>
  </section>

  <!-- 讲义正文 -->
  <section id="lessonStage" class="stage">
    <div class="lessonbar" id="lessonBar"></div>
    <div class="lesson" id="lessonBody"></div>
  </section>

  <!-- 游戏中 -->
  <section id="gameStage" class="stage">
    <div class="qh">
      <span class="pill" id="chName"></span>
      <span style="font-size:13px;color:var(--sub)">第 <b id="qNow">1</b>/<span id="qTot">1</span> 题</span>
      <span class="combo" id="comboEl"></span>
    </div>
    <div class="prog"><div id="progBar" style="width:0%"></div></div>
    <div class="qcard" id="qCard"></div>
    <div class="btns" style="margin-top:8px">
      <button class="btn ghost" onclick="showPanel('homeStage')">← 退出本章</button>
      <button class="btn" id="nextBtn" style="display:none" onclick="nextQ()">下一题 →</button>
    </div>
  </section>

  <!-- 结算 -->
  <section id="resultStage" class="stage">
    <div class="qcard result" id="resultBox"></div>
    <div style="margin-top:14px;text-align:center">
      <button class="btn purple" onclick="openLesson(cur.ch.id)">📖 重看本章讲义</button>
      <button class="btn" onclick="retry()">🔁 再闯一遍</button>
      <button class="btn ghost" onclick="showPanel('homeStage')">回到地图</button>
    </div>
  </section>
</div>

<script>
/* ============================================================
   SguanFOC V3.0.1 讲义 + 题库
   讲义块: {t:'h'|'p'|'code'|'tip', x:...}
   题目:   choice单选 / judge判断 / order排序(opt按正确顺序书写)
   ============================================================ */
const CHAPTERS=[
{ id:1,name:"① 总骨架与数据流",icon:"🏗",
  desc:"全局 Sguan 结构体、4 个公开函数、信号怎么流",
  lesson:[
    {t:"h",x:"一段话建立全局观"},
    {t:"p",x:"这套库做的是<b>PMSM/BLDC 磁场定向控制(FOC)</b>。它把所有状态装进<code>全局结构体 Sguan</code>，所有运算在 <b>两档中断</b>里分层完成，用 <b>status状态机 + mode运行模式</b> 两个字节决定此刻该干什么。看懂这三个“容器”，逻辑就通了一大半。"},
    {t:"code",x:"SguanFOC_System_STRUCT Sguan;   // 全局唯一电机对象 (SguanFOC.h:370)\nSguan.control.Current_Q           // 电流环Q轴PID\nSguan.safe.VBUS_MAX               // 过压阈值\nSguan.encoder.Real_Speed          // 实际机械角速度\nSguan.current.Real_Id/Iq          // dq轴实际电流"},
    {t:"h",x:"四个公开入口 = 任务优先级"},
    {t:"p",x:"函数名即分工，记忆口诀：<b>High算、Low护、Printf收、main发</b>。"},
    {t:"code",x:"void SguanFOC_High_Loop(void);    // PWM高频中断：采样+闭环+SVPWM(快)\nvoid SguanFOC_Low_Loop(void);     // 1kHz低频中断：保护+状态机(慢)\nvoid SguanFOC_Printf_Loop(...);   // 串口/CAN收包：解析上位机指令\nvoid SguanFOC_main_Loop(void);    // 主循环：发送数据给上位机"},
    {t:"h",x:"Sguan 里的子系统"},
    {t:"code",x:"motor(电机硬件) → identify(辨识结果) → current(采样电流)\n→ encoder(编码器角度速度) → foc(目标+缓存) → control(控制器)\n→ lpf(滤波) → safe(保护) → TXdata(收发)"},
    {t:"tip",x:"<b>记忆锚点：</b>把 <code>Sguan.xxx.yyy</code> 当“文件路径”背；字段注释里 <b>(参数设计)/(数据)/(输入值)</b> 告诉你这项该不该由你去调。"}
  ],
  goal:[
    {type:"choice",q:"这套库把“所有数据”都装进一个全局结构体，变量名是？",
     opts:["motor","control","Sguan","FOC"],ans:2,ex:"全局变量 `SguanFOC_System_STRUCT Sguan`(SguanFOC.h:179,370)。"},
    {type:"choice",q:"下面哪个“不是” Sguan 结构体的子系统成员？",
     opts:["safe(保护阈值)","encoder(编码器)","pwm(占空比寄存器)","lpf(低通滤波)"],ans:2,ex:"没有独立 pwm 子系统；PWM占空比存在 foc.Duty_u/v/w。"},
    {type:"choice",q:"哪个公开函数在 PWM 高频中断里做 FOC 闭环计算？",
     opts:["SguanFOC_Low_Loop","SguanFOC_High_Loop","SguanFOC_main_Loop","SguanFOC_Printf_Loop"],ans:1,ex:"High_Loop 算FOC；Low_Loop 1kHz 做保护+状态机。"},
    {type:"choice",q:"哪个函数负责“根据环境切换电机状态机”？",
     opts:["Sguan_GeneratePWM_Loop","Status_Switch_Loop","Sguan_Calculate_Loop","Control_Current_SINGLE"],ans:1,ex:"Status_Switch_Loop 判定并切换状态(SguanFOC.c:1117)。"},
    {type:"judge",q:"判断：PWM 高频中断(High_Loop)和 1kHz 低频中断(Low_Loop)在同一处被调用、做同样的事。",
     correct:false,ex:"不同。High_Loop 做FOC计算(优先级最高)，Low_Loop 1kHz 做保护+状态机(优先级中)。"},
    {type:"order",q:"把“从相电流采样到输出占空比”的链路排好(顶部=第1步)：",
     opts:["采集三相电流 Ia/Ib/Ic","Clarke 变换 → Iα/Iβ","用编码器电角度 Park → Id/Iq","控制器输出 Ud/Uq","反 Park → Uα/Uβ","SVPWM → 三相占空比"],ans:0,ex:"Ia→Iαβ→Id/Iq→控制→反Park→SVPWM。这是 FOC 的主干。"}
  ]},

{ id:2,name:"② 坐标变换与电流流",icon:"🔄",
  desc:"Clarke/Park 在哪个函数、为什么必要",
  lesson:[
    {t:"h",x:"为什么要坐标变换？"},
    {t:"p",x:"电机三相电流是<b>旋转的交流量</b>，直接控制很难。FOC 把它投影到与转子<b>同步旋转</b>的 d/q 坐标上，变成<b>直流分量</b>，就能用 PI 稳得像控直流电机一样。这也是 d/q 名字的由来：<b>d=直轴(励磁)，q=交轴(转矩)</b>。"},
    {t:"h",x:"这段代码在哪个函数？"},
    {t:"p",x:"采样与<b>正变换</b>集中在 <code>Sguan_Calculate_Loop()</code>(SguanFOC.c:294)；<b>反变换</b>(dq→αβ) 在 <code>SVPWM_Tick()</code> 里。中间量全留在 <code>Sguan.current</code> 供你调试。"},
    {t:"code",x:"current.Real_Ia/Ib/Ic       三相电流\n   ↓ Clarke\ncurrent.Real_Ialpha/Ibeta   αβ(静止两相)\n   ↓ Park  (用 encoder.Real_Erad 电角度)\ncurrent.Real_Id/Iq          dq(旋转直流) ← 被PID盯住"},
    {t:"h",x:"关键前提：电角度"},
    {t:"p",x:"Park 变换必须知道<b>此刻转子电角度</b> Real_Erad。所以编码器读数、极对数换算是整个闭环正确的<b>前提</b>——这也是初始化要先做<b>转子对齐/编码器零位</b>(状态 INITIALIZING)的原因。"},
    {t:"tip",x:"<b>记：</b>“闭环能不能对，先看 Real_Erad 对不对”。电流、速度、位置环全都依赖它。"}
  ],
  goal:[
    {type:"choice",q:"把三相电流变成“像直流一样好控”的 dq 量，靠什么变换？",
     opts:["傅里叶变换","Clarke+Park 坐标变换","低通滤波","PID整定"],ans:1,ex:"Clarke(Iabc→Iαβ) + Park(Iαβ→Id/Iq,dq与转子同步旋转)。"},
    {type:"choice",q:"Park 变换必需知道哪个量才能正确进行？",
     opts:["母线电压","目标速度","转子电角度 Real_Erad","占空比"],ans:2,ex:"Park 要用电角度把静止系投影到旋转 d/q 系。"},
    {type:"choice",q:"Id 对应的物理含义是？",
     opts:["直轴(励磁)电流","交轴(转矩)电流","相电流幅值","零序电流"],ans:0,ex:"d=直轴(励磁)，q=交轴(转矩)；q 电流直接关系力矩。"},
    {type:"choice",q:"电流采样+正变换(Clarke/Park)主要在哪完成？",
     opts:["Status_Switch_Loop","Sguan_Calculate_Loop","SguanFOC_Printf_Loop","main_Loop"],ans:1,ex:"Sguan_Calculate_Loop 做编码器/电流采样+变换(SguanFOC.c:294)。"},

/* ============================================================

const KEY="sguanFOC_save_v2";
let save=load();
function load(){ try{return JSON.parse(localStorage.getItem(KEY))||{};}catch(e){return{};} }
function persist(){ try{localStorage.setItem(KEY,JSON.stringify(save));}catch(e){} }
function resetAll(){ if(confirm("确定清空全部进度和分数？")){ save={}; persist(); renderMap(); renderLearnIndex(); showPanel('homeStage'); } }
function starsFor(c){ return (save[c]&&save[c].stars)||0; }
function unlocked(c){ if(c===1)return true; return starsFor(c-1)>0; }
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){let j=(Math.random()*(i+1))|0;[a[i],a[j]]=[a[j],a[i]];} return a; }

let cur=null; // {ch,qs,qi,score,combo,bestCombo,right,total,answered}

function showPanel(id){
  document.querySelectorAll(".stage").forEach(s=>s.classList.remove("on"));
  document.getElementById(id).classList.add("on");
  document.getElementById("tabMap").classList.toggle("on",id==="homeStage");
  document.getElementById("tabLrn").classList.toggle("on",id==="learnIndexStage");
  if(id==="learnIndexStage") renderLearnIndex();
}

/* ---------- 地图 ---------- */
function renderMap(){
  const box=document.getElementById("mapBox"); box.innerHTML="";
  let tot=0, totStar=0;
  CHAPTERS.forEach(ch=>{
    const u=unlocked(ch.id), st=starsFor(ch.id);
    tot+= (save[ch.id]&&save[ch.id].score)||0; totStar+=st;
    const d=document.createElement("div");
    d.className="node"+(u?"":" locked");
    d.innerHTML=`<div class="tt">${ch.icon} ${ch.name} ${u?"":"<span class='lockIco'>🔒</span>"}</div>
      <div class="stars">${st?("★".repeat(st)+"☆".repeat(3-st)):""}</div>
      <div class="ds">${ch.desc}</div>
      <div class="qcount">${ch.goal.length} 题</div>
      <div class="acts">
        <div class="mini learn" onclick="openLesson(${ch.id})">📖 讲义</div>
        <div class="mini play">${u?(st?"🎮 再战":"🎮 闯关"):"🔒 需通关上一章"}</div>
      </div>`;
    if(u) d.querySelector(".mini.play").onclick=()=>startCh(ch.id);
    box.appendChild(d);
  });
  document.getElementById("totalChip").textContent=`⭐ ${tot} 分 · ${totStar}/${CHAPTERS.length*3} 星`;
}

/* ---------- 讲义列表 ---------- */
function renderLearnIndex(){
  const box=document.getElementById("learnIndexBox"); box.innerHTML="";
  CHAPTERS.forEach(ch=>{
    const d=document.createElement("div"); d.className="node";
    d.innerHTML=`<div class="tt">${ch.icon} ${ch.name}</div>
      <div class="ds">${ch.desc}</div>
      <div class="qcount">${ch.lesson.length} 个知识点</div>`;
    d.onclick=()=>openLesson(ch.id);
    box.appendChild(d);
  });
}

/* ---------- 讲义正文 ---------- */
function esc(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function openLesson(id){
  const ch=CHAPTERS.find(x=>x.id===id); cur={ch,qi:0};
  // 顶部章节切换条
  const bar=document.getElementById("lessonBar"); bar.innerHTML="";
  CHAPTERS.forEach(c=>{
    const s=document.createElement("div"); s.className="lseg"+(c.id===id?" on":"");
    s.textContent=`${c.icon}${c.id}`; s.onclick=()=>openLesson(c.id);
    bar.appendChild(s);
  });
  const body=document.getElementById("lessonBody");
  body.innerHTML=`<h2>${ch.icon} ${ch.name}</h2><p class="lede">${ch.desc}</p>`;
  ch.lesson.forEach(b=>{
    const d=document.createElement("div"); d.className="lblk";
    if(b.t==="h"){ d.className="lh"; d.innerHTML=esc(b.x); }
    else if(b.t==="p"){ d.className="lp"; d.innerHTML=b.x; }
    else if(b.t==="code"){ d.innerHTML=`<div class="lpre">${esc(b.x)}</div>`; }
    else if(b.t==="tip"){ d.className="ltip"; d.innerHTML=b.x; }
    body.appendChild(d);
  });
  const nav=document.createElement("div"); nav.className="navbtns";
  nav.innerHTML=`<button class="btn purple" onclick="startCh(${ch.id})">✅ 我看懂了，开始闯关</button>
    <button class="btn ghost" onclick="showPanel('homeStage')">返回</button>`;
  body.appendChild(nav);
  showPanel("lessonStage");
}

/* ---------- 闯关 ---------- */
function startCh(id){
  const ch=CHAPTERS.find(x=>x.id===id);
  const qs=shuffle(ch.goal.map((q,i)=>{ q._oi=i; return q; }));
  cur={ch,qs,qi:0,score:0,combo:0,bestCombo:0,right:0,total:qs.length,answered:false};
  document.getElementById("chName").textContent=`${ch.icon} ${ch.name}`;
  showPanel("gameStage");
  renderQ();
}
function renderQ(){
  const g=cur; const ch=g.ch;
  document.getElementById("qNow").textContent=g.qi+1;
  document.getElementById("qTot").textContent=g.total;
  document.getElementById("progBar").style.width=(g.qi/g.total*100)+"%";
  document.getElementById("comboEl").textContent=g.combo>=2?("🔥 x"+g.combo+" 连击"):"";
  document.getElementById("nextBtn").style.display="none";
  const card=document.getElementById("qCard"); card.innerHTML="";
  const q=g.qs[g.qi]; g.answered=false; g.noteOutShown=false;
  const qname={choice:"✅ 单选",judge:"⚖ 判断",order:"🧩 排序谜题"};
  const host=document.createElement("div");   // 题目作答区
  fbZone=document.createElement("div");       // 对错反馈区
  card.appendChild(host); card.appendChild(fbZone);
  host.innerHTML=`<div class="qtype">${qname[q.type]}</div><div class="qtext">${esc(q.q)}</div>`;
  if(q.type==="choice") buildChoice(host,q);
  else if(q.type==="judge") buildJudge(host,q);
  else buildOrder(host,q);
  addNoteBox(card,q,ch.id);
}
function mkOpt(opts){
  const wrap=document.createElement("div"); wrap.className="opts";
  const letters=["A","B","C","D","E","F"];
  opts.forEach((o,i)=>{
    const b=document.createElement("div"); b.className="opt"; b.dataset.correct=o.correct?1:0;
    b.innerHTML=`<span class="letter">${letters[i]}</span><span>${esc(o.t)}</span>`;
    b.onclick=()=>answer(b,o.correct);
    wrap.appendChild(b);
  });
  return wrap;
}
function buildChoice(card,q){
  const opts=shuffle(q.opts.map((o,i)=>({t:o,correct:i===q.ans})));
  card.appendChild(mkOpt(opts));
}
function buildJudge(card,q){
  const opts=[{t:"✔ 说法正确",correct:q.correct===true},{t:"✘ 说法错误",correct:q.correct!==true}];
  card.appendChild(mkOpt(opts));
}
function answer(el,correct){
  const g=cur; if(g.answered)return; g.answered=true;
  const q=g.qs[g.qi];
  const wrap=el.parentElement;
  [...wrap.children].forEach(x=>x.disabled=true);
  el.classList.add(correct?"correct":"wrong");
  if(!correct) [...wrap.children].forEach(x=>{ if(x.dataset.correct==1) x.classList.add("correct"); });
  showFeedback(correct,q); addResult(correct);
}

/* 排序谜题 */
function buildOrder(card,q){
  const st=cur.orderState={slot:[],rem:shuffle(q.opts),sel:-1};
  const area=document.createElement("div"); area.className="sortArea";
  area.innerHTML=`<div class="pool"><h4>备选（点击加入下方序列）</h4><div class="poolbox" id="poolBox"></div></div>
    <div class="slot"><h4>你的顺序（顶部=第1步）<span style="float:right" id="slotCount">0/${q.opts.length}</span></h4>
      <div class="slotbox" id="slotBox"></div>
      <div class="sortBtns">
        <button class="sbtn" id="upB">↑ 上移选中</button>
        <button class="sbtn" id="downB">↓ 下移选中</button>
        <button class="sbtn" id="clearB">✕ 清空</button>
      </div></div>`;
  card.appendChild(area);
  const poolB=area.querySelector("#poolBox"), slotB=area.querySelector("#slotBox"), slotCount=area.querySelector("#slotCount");
  const setSel=v=>{ st.sel=v; };
  function renderSlots(){
    slotB.innerHTML="";
    st.slot.forEach((s,i)=>{
      const it=document.createElement("div"); it.className="sitem"+(i===st.sel?" sel":"");
      it.innerHTML=`<span class="snum">${i+1}</span><span style="flex:1">${esc(s)}</span><button class="rm">✕</button>`;
      it.onclick=()=>{ setSel(st.sel===i?-1:i); renderSlots(); };
      it.querySelector(".rm").onclick=(e)=>{ e.stopPropagation(); const idx=i; const v=st.slot[idx]; st.slot.splice(idx,1); st.rem.push(v); if(st.sel===idx)setSel(-1); else if(st.sel>idx)setSel(st.sel-1); renderSlots(); };
      slotB.appendChild(it);
    });
    slotCount.textContent=`${st.slot.length}/${q.opts.length}`;
    poolB.innerHTML="";
    st.rem.forEach((p,i)=>{
      const it=document.createElement("div"); it.className="sitem poolitem";
      it.innerHTML=`<span style="flex:1">${esc(p)}</span><span class="snum">＋</span>`;
      it.onclick=()=>{ const v=st.rem[i]; st.slot.push(v); st.rem.splice(i,1); setSel(-1); renderSlots(); };
      poolB.appendChild(it);
    });
    const chk=card.querySelector("#chkB");
    const full=st.slot.length===q.opts.length;
    if(chk) chk.style.display=(!cur.answered&&full)?"inline-block":"none";
    if(!chk&&!cur.answered&&full){
      const c=document.createElement("button"); c.id="chkB"; c.className="btn"; c.style.marginTop="14px";
      c.textContent="✅ 检查顺序"; c.onclick=()=>checkAnswer(q); area.after(c);
    }
  }
  function move(d){
    if(st.sel<0){ slotCount.textContent=`${st.slot.length}/${q.opts.length}（先点序列中一项再移）`; return; }
    const ni=st.sel+d; if(ni<0||ni>=st.slot.length)return;
    const tmp=st.slot[st.sel]; st.slot[st.sel]=st.slot[ni]; st.slot[ni]=tmp; setSel(ni); renderSlots();
  }
  renderSlots();
  area.querySelector("#upB").onclick=()=>move(-1);
  area.querySelector("#downB").onclick=()=>move(1);
  area.querySelector("#clearB").onclick=()=>{ st.rem=st.rem.concat(st.slot); st.slot=[]; setSel(-1); renderSlots(); };
}
function checkAnswer(q){
  const g=cur; if(g.answered)return; g.answered=true;
  const order=g.orderState.slot, n=q.opts.length;
  const match=order.length===n && order.every((x,i)=>x===q.opts[i]);
  showFeedback(match,q,order); addResult(match);
}

/* 内联 markdown：把 `code` 变成高亮(先转义防注入) */
function md(s){
  return esc(s).replace(/`([^`]+)`/g,"<code>$1</code>");
}
function showFeedback(correct,q,order){
  const fb=document.createElement("div");
  fb.className="feedback "+(correct?"good":"bad");
  const head= correct? "🎉 正确！" : (order? "❌ 顺序有误":"❌ 不对哦");
  fb.innerHTML=`<b>${head}</b><div class="ex">💡 ${md(q.ex)}</div>`;
  if(order&&!correct){
    const corr=q.opts.map((x,i)=>`${i+1}. ${x}`).join("  →  ");
    fb.insertAdjacentHTML("beforeend",`<div class="ex">✔ 正确顺序：${corr}</div>`);
  }
  fbZone.appendChild(fb);
  document.getElementById("nextBtn").style.display="inline-block";
}
function addResult(correct){
  const g=cur;
  if(correct){ g.right++; g.combo++; g.bestCombo=Math.max(g.bestCombo,g.combo); g.score+=100+(g.combo-1)*10; }
  else g.combo=0;
  document.getElementById("comboEl").textContent=g.combo>=2?("🔥 x"+g.combo+" 连击"):"";
}
function nextQ(){
  const g=cur; g.answered=false; g.orderState=null; g.qi++;
  if(g.qi>=g.total){ finish(); return; }
  renderQ();
}
function finish(){
  const g=cur;
  const ratio=g.right/g.total;
  const stars= ratio>=0.85?3 : ratio>=0.7?2 : ratio>=0.5?1 : 0;
  const old=save[g.ch.id]||{}; const pass=stars>0;
  const newStars=Math.max(stars,old.stars||0);
  save[g.ch.id]={stars:pass?newStars:0, score:(old.score||0)+g.score, best:Math.max(old.best||0,g.bestCombo)};
  persist();
  const r=document.getElementById("resultBox");
  r.innerHTML=`<h2>${pass?"🏆 章节完成！":g.ch.icon+" 差一点…"}</h2>
    <div class="rStars">${"★".repeat(newStars)}${"☆".repeat(3-newStars)}</div>
    <div class="scoreBig">${g.score} 分</div>
    <div class="rStats">答对 ${g.right}/${g.total} · 最高连击 x${g.bestCombo}${pass?"":"（≥50% 正确即可过关）"}</div>`;
  showPanel("resultStage"); renderMap();
}
function retry(){ if(cur&&cur.ch) startCh(cur.ch.id); }

/* ============================================================
   薄弱点记录 + 按内容解释
   ============================================================ */
let fbZone=null;
const NKEY="sguanFOC_notes_v1";
let NOTES=loadNotes();
function loadNotes(){ try{return JSON.parse(localStorage.getItem(NKEY))||{};}catch(e){return{};} }
function persistNotes(){ try{localStorage.setItem(NKEY,JSON.stringify(NOTES));}catch(e){} }
function qidOf(chId,q){ return chId+"_"+ (q._oi!==undefined? q._oi : (cur.ch.id===chId?cur.qs.indexOf(q):-1)); }

/* 每题一个记录框 */
function addNoteBox(card,q,chId){
  const qid=qidOf(chId,q);
  const saved=(NOTES[qid]||"").trim();
  const box=document.createElement("div"); box.className="noteBox";
  box.innerHTML=`<div class="noteHead">📝 我的薄弱点 / 卡点记录
      <span class="noteTip">写下这题你不懂/答错的原因，我会按你写的内容解释</span></div>
    <textarea class="noteTa" placeholder="例：不懂为什么电角度错整个环就不对 / Q31 和 float 有啥区别 / watchdog 为什么不会误停…">${esc(saved)}</textarea>
    <div class="noteBtns">
      <button class="sbtn" id="noteGo">🔍 保存并按我的记录解释</button>
      <button class="sbtn" id="noteClear">✕ 清空</button>
      <span class="noteState"></span>
    </div>
    <div class="noteOut"></div>`;
  card.appendChild(box);
  const ta=box.querySelector("textarea");
  const out=box.querySelector(".noteOut");
  const st=box.querySelector(".noteState");
  box.querySelector("#noteGo").onclick=()=>{
    const txt=ta.value.trim();
    NOTES[qid]=txt; persistNotes();
    if(txt) st.textContent="✓ 已保存（下面是对你记录的解释）";
    renderNoteExplain(out,q,chId,txt,true);
  };
  box.querySelector("#noteClear").onclick=()=>{ ta.value=""; NOTES[qid]=""; persistNotes(); out.innerHTML=""; st.textContent=""; };
  if(saved){ st.textContent="有上次的记录，可点上方按钮重新解释"; renderNoteExplain(out,q,chId,saved,false); }
}

   d:"<code>foc.Real_VBUS</code> 由 User_VBUS_DataGet 每 1ms 刷新(-9999 表示没接)。过压/欠压阈值在 safe.VBUS_MAX/MIM；开环 SVPWM 会除以 VBUS 归一化。"},
  {k:["低通","滤波","LPF","lpf"],
   name:"低通滤波 LPF",
   d:"D/Q 轴电流、速度反馈都各有一个低通(LPF_STRUCT)：滤采样噪声，让反馈平滑。T=采样周期，系数决定截止频率。"},
  {k:["pll","锁相环"],
   name:"PLL 锁相环(测速)",
   d:"<code>encoder.pll</code> 用锁相环从位置脉冲提取速度(比直接差分稳)，Real_Speed 机械角速度由它给出。"}
];

/* 保存后：按记录内容生成解释 */
function renderNoteExplain(out,q,chId,txt,doScroll){
  if(!txt){ showNoteEmpty(out); return; }
  const lower=txt.toLowerCase();
  const hits=[];
  CONCEPTS.forEach(c=>{
    const ok=c.k.some(k=>lower.includes(k.toLowerCase()));
    if(ok) hits.push(c);
  });
  const html=[];
  if(hits.length===0){
    html.push(`<div class="noteEmpty"><b>我还没能完全对上你写的内容 😅</b><br>
      试着把卡点写得更具体，例如：<br>
      · <code>电角度怎么算？错一点会怎样？</code><br>
      · <code>watchdog 的 limit 和 limit×10 各干什么？</code><br>
      · <code>Q31 标幺怎么来的？为什么省时间？</code><br>
      · <code>四种 mode 到底差在哪？</code><br>
      下面先附上本题解析，帮你定位。</div>`);
  }else{
    html.push(`<div style="font-size:12px;color:var(--acc2);font-weight:700;margin-bottom:2px">🧠 根据你的记录，解释这些概念</div>`);
    hits.forEach(c=>{
      html.push(`<div class="cbox"><div class="cbTitle">▸ ${c.name}</div><div class="cbBody">${c.d}</div></div>`);
    });
  }
  // 附带本题解析(定位用)
  html.push(`<div class="excerpt"><b>💡 本题要点：</b>${md(q.ex)}</div>`);
  // 相关讲义摘录
  const ch=CHAPTERS.find(x=>x.id===chId);
  const kwLower=txt.toLowerCase();
  const rel=[];
  (ch.lesson||[]).forEach(b=>{
    const btxt=(b.x||"").toLowerCase();
    const hit=CONCEPTS.some(c=>c.k.some(k=>btxt.includes(k.toLowerCase())&&kwLower.includes(k.toLowerCase())));
    if(hit && b.t!=="h" && rel.length<2) rel.push({t:b.t,x:b.x});
  });
  if(rel.length){
    html.push(`<div style="font-size:12px;color:var(--gold);font-weight:700;margin-top:2px">📚 本章讲义摘录（和你记录相关）</div>`);
    rel.forEach(r=>{
      html.push(`<div class="excerpt">${r.t==="code"?"<code>代码：</code>":"<code>讲义：</code>"}${esc(r.x).slice(0,220)}${r.x.length>220?"…":""}</div>`);
    });
  }
  out.innerHTML=html.join("");
  if(hits.length && doScroll) out.scrollIntoView({behavior:"smooth",block:"nearest"});
}
function showNoteEmpty(out){
  out.innerHTML=`<div class="noteEmpty">先在框里写下你的卡点，再点“保存并按我的记录解释”～
  写得越具体（概念名/现象/你的疑问），解释越贴合。</div>`;
}

/* init */
renderMap(); renderLearnIndex();
</script>
